name: Deploy to Firebase Hosting on push

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build (if package.json exists)
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build
            # Si el build genera "build" en vez de "dist", copia/mueve a dist para Firebase
            if [ -d build ] && [ ! -d dist ]; then
              mv build dist || cp -r build dist
            fi
          else
            echo "No package.json, skipping build"
          fi

      - name: "Debug: listar archivos relevantes"
        run: |
          echo "Contenido raíz:"
          ls -la
          echo "Contenido 'dist' (si existe):"
          ls -la dist || true
          echo "Contenido 'public' (si existe):"
          ls -la public || true

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: web-feria-dg-istg-2026
          channelId: live
