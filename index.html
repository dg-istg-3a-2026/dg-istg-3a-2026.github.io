<!DOCTYPE html>
<html lang="es" class="select-none touch-manipulation">
<head>

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

    @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.4); } 100% { transform: scale(1); } }
    .glass-panel { background: rgba(11, 18, 47, 0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
  <script>
    setInterval(()=>{try{Function('debugger')()}catch(e){}}, 2500);
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => { if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || (e.ctrlKey && e.key === 'u')) e.preventDefault(); });
  </script>
</head>
<body class="fixed inset-0 w-full h-full text-white">
  
  <div id="loader" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-[#232453] transition-opacity duration-500">
    <div class="w-16 h-16 border-4 border-blue-500/30 border-t-blue-500 rounded-full animate-spin"></div>
    <p class="mt-4 text-blue-200/80 font-bold tracking-widest text-sm animate-pulse">SINCRONIZANDO...</p>
  </div>

  <canvas id="cvs"></canvas>

  <div id="hud" class="absolute inset-0 pointer-events-none z-40 transition-opacity duration-300 opacity-100 flex flex-col justify-end p-4 sm:p-6 pb-8 sm:pb-10">
    <div class="glass-panel p-2 sm:p-3 rounded-3xl flex items-center gap-1 sm:gap-2 w-max mx-auto shadow-2xl pointer-events-auto relative">
      
      <script>
        const _rx = [{e:'😍', l:'Mínimo Común Múltiplo'},{e:'😂', l:'Comic Sans'},{e:'🤡', l:'Kerning Caótico'},{e:'😱', l:'Píxel Muerto'},{e:'🤌', l:'Arte Puro'}];
        document.write(_rx.map(r => `<button onclick="window._hRC('${r.e}')" id="btn-${r.e}" class="relative flex items-center justify-center w-12 h-12 rounded-[18px] hover:bg-white/10 transition-all duration-200 active:scale-90"><span class="text-2xl drop-shadow-md pointer-events-none">${r.e}</span><div id="bdg-${r.e}" class="absolute -top-1 -right-1 min-w-[20px] h-[20px] bg-slate-800/90 border border-white/20 rounded-full flex items-center justify-center text-[10px] font-bold shadow-md transition-colors"><span id="cnt-${r.e}">0</span></div></button>`).join(''));
      </script>
      
      <div class="w-px h-8 bg-white/20 mx-1"></div>
      
      <div class="relative">
        <button id="btnMega" onclick="window._tglS()" class="relative flex items-center justify-center w-12 h-12 rounded-[18px] bg-blue-500/20 border border-blue-400/30 hover:bg-blue-500/40 transition-all active:scale-90">
          <span class="text-2xl">📢</span>
          <div id="mCd" class="absolute inset-0 bg-slate-900/90 rounded-[18px] flex items-center justify-center text-orange-500 font-black text-xl opacity-0 transition-opacity backdrop-blur-sm pointer-events-none"></div>
        </button>
        
        <div id="shoutMenu" class="absolute bottom-full right-0 mb-4 glass-panel p-2 rounded-2xl shadow-2xl flex-col gap-1 w-[200px] hidden origin-bottom z-50">
          <button onclick="window._sndS('¡Tipografía God! 💅')" class="w-full text-left px-4 py-3 rounded-xl text-sm font-bold hover:bg-white/10 active:bg-white/20 text-blue-100">¡Tipografía God! 💅</button>
          <button onclick="window._sndS('Mucho texto 👀')" class="w-full text-left px-4 py-3 rounded-xl text-sm font-bold hover:bg-white/10 active:bg-white/20 text-yellow-100">Mucho texto 👀</button>
          <button onclick="window._sndS('¡Brutal el Layout! 🔥')" class="w-full text-left px-4 py-3 rounded-xl text-sm font-bold hover:bg-white/10 active:bg-white/20 text-orange-100">¡Brutal el Layout! 🔥</button>
          <button onclick="window._sndS('Arte puro ✨')" class="w-full text-left px-4 py-3 rounded-xl text-sm font-bold hover:bg-white/10 active:bg-white/20 text-purple-100">Arte puro ✨</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp as _iA } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth as _gA, signInAnonymously as _sIA, setPersistence as _sP, browserLocalPersistence as _bLP, inMemoryPersistence as _iMP } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore as _gF, doc as _dC, onSnapshot as _oS, collection as _cC, addDoc as _aD, setDoc as _sD, getDoc as _gD, increment as _inc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const _cfg = { apiKey: "AIzaSyDYbe0MMuPvpdJiYlvtcDec-MybKqCad9k", authDomain: "web-feria-istg-2026.firebaseapp.com", databaseURL: "https://web-feria-istg-2026-default-rtdb.firebaseio.com", projectId: "web-feria-istg-2026", storageBucket: "web-feria-istg-2026.firebasestorage.app", messagingSenderId: "434583648721", appId: "1:434583648721:web:a31a4ec9e99dc7faf8c8f0" };
    const _app = _iA(_cfg), _au = _gA(_app), _db = _gF(_app);
    const _rp = { o: 'dg-istg-3a-2026', r: 'dg-istg-3a-2026.github.io', b: 'MochilaDeCaleb', f: [], c: '' };
    
    let _rU = null, _sU = null, _hT = null;

    // HUD Auto-hide
    window.addEventListener('pointermove', () => {
       const h = document.getElementById('hud');
       h.classList.replace('opacity-30', 'opacity-100');
       clearTimeout(_hT);
       _hT = setTimeout(() => {
          if(document.getElementById('shoutMenu').classList.contains('hidden')) h.classList.replace('opacity-100', 'opacity-30');
       }, 3000);
    });

    // Motor Megáfono (Optimizador de latencia y UI)
    window._tglS = () => {
      if(navigator.vibrate) try{navigator.vibrate(10)}catch(e){}
      const m = document.getElementById('shoutMenu');
      if(m.classList.contains('hidden')) { m.classList.remove('hidden'); m.classList.add('flex'); m.animate([{transform:'translateY(10px)',opacity:0},{transform:'translateY(0)',opacity:1}],{duration:200,easing:'ease-out'}); }
      else { m.classList.add('hidden'); m.classList.remove('flex'); }
    };

    window._xC = false;
    window._sndS = async (txt) => {
       window._tglS();
       if(window._xC || !_au.currentUser) return;
       window._xC = true;
       if(navigator.vibrate) try{navigator.vibrate([20,30])}catch(e){}

       const b = document.getElementById('btnMega'), c = document.getElementById('mCd');
       if(b) b.style.pointerEvents = 'none';
       if(c) { c.style.opacity = '1'; c.innerText = '6'; }

       try {
           window._drwS(txt, true);
           await _aD(_cC(_db, 'Feria2026_Global', 'Megafono', 'Mensajes'), { t: txt, ts: Date.now(), uid: _au.currentUser.uid });
       } catch(e) {}

       let d = 6;
       const i = setInterval(() => {
           d--;
           if(c) c.innerText = d;
           if(d <= 0) {
               clearInterval(i);
               window._xC = false;
               if(b) b.style.pointerEvents = 'auto';
               if(c) c.style.opacity = '0';
           }
       }, 1000);
    };

    // Física Danmaku (Comentarios Flotantes)
    window._drwS = (txt, isL = false) => {
       const v = document.createElement('div');
       v.textContent = txt;
       const iM = window.innerWidth < 768;
       v.className = `fixed z-[100] font-black whitespace-nowrap opacity-90 drop-shadow-lg pointer-events-none will-change-transform ${isL?'text-orange-300':'text-white'}`;
       v.style.fontSize = iM ? '22px' : '34px';
       v.style.top = `${15 + Math.random() * 55}%`;
       v.style.left = `${window.innerWidth}px`;
       v.style.webkitTextStroke = '1px rgba(0,0,0,0.8)';
       document.body.appendChild(v);

       requestAnimationFrame(() => {
           const w = v.offsetWidth;
           v.animate([
               { transform: 'translate3d(0, 0, 0)' },
               { transform: `translate3d(-${window.innerWidth + w + 100}px, 0, 0)` }
           ], { duration: iM ? 4500 : 6500, easing: 'linear' }).onfinish = () => v.remove();
       });
    };

    // Escáner de Reacciones Táctiles
    let _rLk = false;
    window._hRC = async (em) => {
       if(_rLk || !_au.currentUser || !_rp.c) return;
       _rLk = true; setTimeout(() => _rLk = false, 600);
       if(navigator.vibrate) try{navigator.vibrate(15)}catch(e){}
       
       const id = _rp.c.replace(/[^a-zA-Z0-9]/g, '_');
       const oE = localStorage.getItem(`_r_${id}`);
       if(oE === em) return; // Ya votó por este

       try {
           const rf = _dC(_db, 'Feria2026_Images', id);
           const p = { [em]: _inc(1) };
           if(oE) p[oE] = _inc(-1);
           await _sD(rf, p, { merge: true });
           localStorage.setItem(`_r_${id}`, em);
           window._uRB(id);
       } catch(e) {}
    };

    window._uRB = (id) => {
       const a = localStorage.getItem(`_r_${id}`);
       ['😍','😂','🤡','😱','🤌'].forEach(e => {
           const b = document.getElementById(`btn-${e}`), bg = document.getElementById(`bdg-${e}`);
           if(b && bg) {
               if(a === e) { b.classList.add('bg-orange-500/30', 'border', 'border-orange-500/50'); bg.classList.add('bg-orange-500', 'text-white'); }
               else { b.classList.remove('bg-orange-500/30', 'border', 'border-orange-500/50'); bg.classList.remove('bg-orange-500', 'text-white'); }
           }
       });
    };

    // Motor de Carga CDN
    async function _lG() {
       try {
           const rs = await fetch(`https://cdn.jsdelivr.net/gh/${_rp.o}/${_rp.r}@${_rp.b}/galeria.json?t=${Date.now()}`);
           if(rs.ok) _rp.f = await rs.json();
       } catch(e) {}
       if(_rp.f.length > 0) _nI();
    }

    function _nI() {
       const uV = _rp.f.filter(i => i !== _rp.c);
       if(uV.length === 0) return;
       _rp.c = uV[Math.floor(Math.random() * uV.length)];
       const id = _rp.c.replace(/[^a-zA-Z0-9]/g, '_');

       const img = new Image();
       img.src = `https://cdn.jsdelivr.net/gh/${_rp.o}/${_rp.r}@${_rp.b}/${encodeURIComponent(_rp.c)}`;
       img.onload = () => {
           const c = document.getElementById('cvs'), x = c.getContext('2d');
           c.width = window.innerWidth * Math.min(window.devicePixelRatio, 2);
           c.height = window.innerHeight * Math.min(window.devicePixelRatio, 2);
           x.clearRect(0,0,c.width,c.height);
           const s = Math.min(c.width/img.width, c.height/img.height) * 0.95;
           x.drawImage(img, (c.width - img.width*s)/2, (c.height - img.height*s)/2, img.width*s, img.height*s);
           document.getElementById('loader').classList.add('hidden');
           
           if(_rU) _rU();
           window._uRB(id);
           _rU = _oS(_dC(_db, 'Feria2026_Images', id), sn => {
               const d = sn.exists() ? sn.data() : {};
               ['😍','😂','🤡','😱','🤌'].forEach(e => {
                   const ct = document.getElementById(`cnt-${e}`), bg = document.getElementById(`bdg-${e}`);
                   const nV = d[e] || 0;
                   if(ct && ct.textContent !== nV.toString()) {
                       ct.textContent = nV;
                       bg.classList.remove('animate-pop'); void bg.offsetWidth; bg.classList.add('animate-pop');
                   }
               });
           });
       };
    }

    window.addEventListener('resize', () => { if(_rp.c) _nI(); });

    // Inicialización del Sistema Global
    async function _ini() {
       try { await _sP(_au, _bLP); } catch(e) { await _sP(_au, _iMP); }
       await _sIA(_au);
       _lG();

       let _iF = true;
       _sU = _oS(_cC(_db, 'Feria2026_Global', 'Megafono', 'Mensajes'), sn => {
           sn.docChanges().forEach(ch => {
               if(ch.type === 'added' && !_iF) {
                   const dt = ch.doc.data();
                   if(dt.uid !== _au.currentUser.uid) window._drwS(dt.t, false);
               }
           });
           _iF = false;
       });
       
       // Registro silencioso de estadísticas
       try { await _sD(_dC(_db,'Feria2026_Global','Estadisticas'), { vis: _inc(1) }, { merge:true }); } catch(e){}
    }

    _ini();
  </script>
</body>
</html>
