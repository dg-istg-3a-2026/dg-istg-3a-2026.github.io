    .glass-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;

  <script type="module">

    import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, addDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const VALID_EXTENSIONS = ['.png', '.jpg', '.jpeg', '.webp', '.gif', '.svg', '.bmp', '.avif'];

    const hudContainer = document.getElementById('hud-container');
    const floatingLayer = document.getElementById('floatingCommentsLayer');

    let db = null; let auth = null;

    const MY_FIREBASE_CONFIG = {
      apiKey: "AIzaSyDYbe0MMuPvpdJiYlvtcDec-MybKqCad9k",
      authDomain: "web-feria-istg-2026.firebaseapp.com",
      databaseURL: "https://web-feria-istg-2026-default-rtdb.firebaseio.com",
      projectId: "web-feria-istg-2026",
      storageBucket: "web-feria-istg-2026.firebasestorage.app",
      messagingSenderId: "434583648721",
      appId: "1:434583648721:web:a31a4ec9e99dc7faf8c8f0"
    };

    // Funciones del Motor Háptico y HUD (Declaradas en window para evitar errores)
    window.triggerHaptic = function(pattern) {
      if (navigator.vibrate) {
        try { navigator.vibrate(pattern); } catch (e) {}
      }
    };

    window.updateSpotlight = function(e) {
      const docks = document.querySelectorAll('.glass-panel');
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      
      docks.forEach(dock => {
        const rect = dock.getBoundingClientRect();
        const relativeX = x - rect.left;
        const relativeY = y - rect.top;
        dock.style.setProperty('--spotlight-x', `${relativeX}px`);
        dock.style.setProperty('--spotlight-y', `${relativeY}px`);
      });
      window.resetHudActivity();
    };

    let hudActivityTimer = null;
    window.isChatOpen = false;

    window.keepHudActive = function() {
      window.hudHovered = true;
      window.resetHudActivity();
    };

    window.startHudIdleTimer = function() {
      window.hudHovered = false;
      window.resetHudActivity();
    };

    window.resetHudActivity = function() {
      if (!window.isGalleryReady || window.isChatOpen) return;
      
      hudContainer.classList.remove('opacity-25');
      hudContainer.classList.add('opacity-100');
      
      clearTimeout(hudActivityTimer);
      
      hudActivityTimer = setTimeout(() => {
        if (!window.isChatOpen && !window.hudHovered) {
          hudContainer.classList.add('opacity-25');
        }
      }, 4000);
    };

    // Funciones de Notificación (Toast)
    const toastPhrases = [
      "Alguien critica en capas...",
      "Tensión tipográfica detectada...",
      "Un vector acaba de opinar...",
      "Alguien guardó esto como 'final_final.pdf'...",
      "Debate sobre colores Pantone en curso...",
      "Se detectó una crítica constructiva..."
    ];
    let toastTimeout = null;

    window.showNewCommentToast = function() {
      if (window.isChatOpen) return;
      
      const toast = document.getElementById('newCommentToast');
      const msg = document.getElementById('toastMessage');
      if (!toast || !msg) return;

      msg.textContent = toastPhrases[Math.floor(Math.random() * toastPhrases.length)];
      
      toast.classList.remove('translate-y-8', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-8', 'opacity-0');
      }, 4000);
    };

    window.onload = async function() {
      resizeCanvas(); window.addEventListener('resize', resizeCanvas);
      
      // Cargar logo con Blob para ofuscar
      try {
        const logoRes = await fetch("https://raw.githubusercontent.com/caortiz-stack/hosting/fdee49b549ea1c399079948645fb51c8645a8a80/Recurso%201.svg");
        const logoBlob = await logoRes.blob();
        document.getElementById('loaderLogo').src = URL.createObjectURL(logoBlob);
      } catch(e){}

      if (document.fonts) document.fonts.ready.then(() => {
          const sticker = document.getElementById('stickerAssembly');
          if (sticker) sticker.classList.remove('opacity-0');
      });
      await initFirebaseAndApp();
    };

    async function initFirebaseAndApp() {
      try {
        const app = initializeApp(MY_FIREBASE_CONFIG);
        auth = getAuth(app); db = getFirestore(app);
        await signInAnonymously(auth); 
        await initGallery();
      } catch (e) {
        await initGallery();
      }
    }

    function getImageDocId(path) { return btoa(path).replace(/[/+=]/g, '_'); }

    let activeReactionsUnsubscribe = null;
    let activeCommentsUnsubscribe = null;

    async function setupRealtimeListeners(imagePath) {
      if (!db || !auth.currentUser) return;
      const imgDocId = getImageDocId(imagePath);

      if (activeReactionsUnsubscribe) activeReactionsUnsubscribe();
      if (activeCommentsUnsubscribe) activeCommentsUnsubscribe();
      if (commentFloatingInterval) clearInterval(commentFloatingInterval);
      
      userCurrentReaction = null;
      currentImageComments = [];
      isInitialCommentsStaggeredDone = false;
      updateReactionButtonsUI();

      try {
        const userVoteDoc = doc(db, 'Feria2026_Images', imgDocId, 'Voters', auth.currentUser.uid);
        const voteSnap = await getDoc(userVoteDoc);
        if (voteSnap.exists()) {
          userCurrentReaction = voteSnap.data().emoji;
          updateReactionButtonsUI();
        }
      } catch (e) {}

      const reactionsRef = doc(db, 'Feria2026_Images', imgDocId);
      activeReactionsUnsubscribe = onSnapshot(reactionsRef, (snapshot) => {
        const data = snapshot.exists() ? snapshot.data() : {};
        ['😍', '😂', '🤡', '😱', '🤌'].forEach(emoji => {
          const countEl = document.getElementById(`count-${emoji}`);
          const badgeEl = document.getElementById(`badge-${emoji}`);
          if (countEl && badgeEl) {
            const oldVal = countEl.textContent;
            const newVal = (data[emoji] || 0).toString();
            if (oldVal !== newVal) {
              countEl.textContent = newVal;
              badgeEl.classList.remove('animate-pop');
              void badgeEl.offsetWidth; 
              badgeEl.classList.add('animate-pop');
              
              if (userCurrentReaction === emoji) {
                badgeEl.classList.add('bg-orange-500', 'text-white', 'border-orange-300/50');
                badgeEl.classList.remove('bg-white/10', 'text-slate-200');
              } else {
                badgeEl.classList.remove('bg-orange-500', 'text-white', 'border-orange-300/50');
                badgeEl.classList.add('bg-white/10', 'text-slate-200');
              }
            }
          }
        });
      }, (err) => {});

      const commentsColRef = collection(db, 'Feria2026_Images', imgDocId, 'Comentarios');
      const q = query(commentsColRef, orderBy('timestamp', 'asc'));
      
      let isFirstSnapshot = true;
      activeCommentsUnsubscribe = onSnapshot(q, (snapshot) => {
        const commentsList = document.getElementById('commentsList');
        const commentCountBadge = document.getElementById('commentCountBadge');
        if (!commentsList) return;

        if (commentCountBadge) commentCountBadge.textContent = snapshot.docs.length.toString();
        currentImageComments = snapshot.docs.map(d => d.data().text);

        if (snapshot.docs.length === 0) {
          commentsList.innerHTML = '';
          isFirstSnapshot = false;
          return;
        }

        if (isFirstSnapshot) {
          commentsList.innerHTML = '';
          snapshot.docs.forEach((docSnap, index) => {
            const c = docSnap.data();
            appendCommentToList(commentsList, c);
            setTimeout(() => { spawnMovingDanmaku(c.text); }, index * 1000);
          });
          isInitialCommentsStaggeredDone = true;
        } else {
          snapshot.docChanges().forEach((change) => {
            if (change.type === 'added' && isInitialCommentsStaggeredDone) {
              const c = change.doc.data();
              appendCommentToList(commentsList, c);
              spawnMovingDanmaku(c.text);
              window.showNewCommentToast();
            }
          });
        }
        isFirstSnapshot = false;
      }, (err) => {});

      commentFloatingInterval = setInterval(() => {
        if (currentImageComments.length > 0) {
          const randomComment = currentImageComments[Math.floor(Math.random() * currentImageComments.length)];
          spawnMovingDanmaku(randomComment);
        }
      }, 6000);
    }

    function appendCommentToList(container, c) {
      const item = document.createElement('div');
      item.textContent = c.text;
      container.appendChild(item);
    }

    function updateReactionButtonsUI() {
      ['😍', '😂', '🤡', '😱', '🤌'].forEach(emoji => {
        const btn = document.getElementById(`btn-${emoji}`);
        const badgeEl = document.getElementById(`badge-${emoji}`);
        if (!btn || !badgeEl) return;
        
        if (userCurrentReaction === emoji) {
          btn.classList.add('bg-orange-500/30', 'border', 'border-orange-400/60', 'scale-105');
          badgeEl.classList.add('bg-orange-500', 'text-white', 'border-orange-300/50');
          badgeEl.classList.remove('bg-white/10', 'text-slate-200');
        } else {
          btn.classList.remove('bg-orange-500/30', 'border', 'border-orange-400/60', 'scale-105');
          badgeEl.classList.remove('bg-orange-500', 'text-white', 'border-orange-300/50');
          badgeEl.classList.add('bg-white/10', 'text-slate-200');
        }
      });
    }

    function spawnMovingDanmaku(text) {
      if (!floatingLayer) return;
      const bubble = document.createElement('div');
      bubble.className = 'floating-comment-bubble';
      bubble.textContent = text;
      
      const startX = 10 + Math.random() * 65; 
      const startY = 68 + Math.random() * 20; 
      
      bubble.style.left = `${startX}%`;
      bubble.style.top = `${startY}%`;
      
      floatingLayer.appendChild(bubble);
      setTimeout(() => { if (bubble.parentNode) bubble.remove(); }, 8000);
    }

    window.handleReactionClick = async function(emoji, designJokeName) {
      window.triggerHaptic([20, 30, 20]);
      window.resetHudActivity();
      
      const btn = document.getElementById(`btn-${emoji}`);
      if (!btn) return;

      const rect = btn.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top;
      
      const particleCount = 8 + Math.floor(Math.random() * 6);

      for (let i = 0; i < particleCount; i++) {
        const p = document.createElement('div');
        p.textContent = emoji;
        p.className = 'fixed z-[70] pointer-events-none select-none drop-shadow-md';
        p.style.fontSize = `${16 + Math.random() * 14}px`;
        p.style.left = `${centerX - 10}px`; 
        p.style.top = `${centerY - 10}px`;
        p.style.filter = `blur(${Math.random() * 2}px)`;
        document.body.appendChild(p);

        const angle = -Math.PI / 2 + (Math.random() * 1.4 - 0.7);
        const velocity = 50 + Math.random() * 100;
        const endX = centerX + Math.cos(angle) * velocity;
        const endY = centerY - (140 + Math.random() * 120); 

        p.animate([
          { transform: 'translate(0, 0) scale(0.4) rotate(0deg)', opacity: 1 },
          { transform: `translate(${endX - centerX}px, ${endY - centerY}px) scale(1.4) rotate(${Math.random() * 90 - 45}deg)`, opacity: 0.85, offset: 0.6 },
          { transform: `translate(${(endX - centerX) * 1.3}px, ${(endY - centerY) - 80}px) scale(0.5) rotate(${Math.random() * 180}deg)`, opacity: 0 }
        ], { duration: 1000 + Math.random() * 500, easing: 'cubic-bezier(0.25, 1, 0.5, 1)' }).onfinish = () => p.remove();
      }

      btn.classList.add('scale-90');
      setTimeout(() => btn.classList.remove('scale-90'), 120);

      if (!db || !auth || !auth.currentUser || !state.currentImagePath) return;
      const imgDocId = getImageDocId(state.currentImagePath);
      const reactionsRef = doc(db, 'Feria2026_Images', imgDocId);
      const userVoteDoc = doc(db, 'Feria2026_Images', imgDocId, 'Voters', auth.currentUser.uid);

      let payload = {};
      const previousReaction = userCurrentReaction;

      if (previousReaction === emoji) {
        showJokeBadgeAnimation(emoji, designJokeName);
        return;
      }

      if (previousReaction) {
        payload[previousReaction] = window.firebaseIncrement ? window.firebaseIncrement(-1) : -1;
        payload[emoji] = window.firebaseIncrement ? window.firebaseIncrement(1) : 1;
      } else {
        payload[emoji] = window.firebaseIncrement ? window.firebaseIncrement(1) : 1;
      }

      userCurrentReaction = emoji;
      updateReactionButtonsUI();
      showJokeBadgeAnimation(emoji, designJokeName);

      try {
        await setDoc(reactionsRef, payload, { merge: true });
        await setDoc(userVoteDoc, { emoji: emoji, timestamp: serverTimestamp() });
      } catch (err) {}
    };

    function showJokeBadgeAnimation(emoji, jokeName) {
      const jokeBadge = document.createElement('div');
      jokeBadge.className = 'fixed z-[80] pointer-events-none flex flex-col items-center justify-center w-full top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2';
      jokeBadge.innerHTML = `
        <span class="text-[80px] sm:text-[110px] filter drop-shadow-[0_0_40px_rgba(255,85,0,0.8)] mb-[-20px] z-10 animate-bounce">${emoji}</span>
        <span class="font-display bg-black/80 backdrop-blur-2xl border-2 border-orange-500/40 text-orange-100 px-6 py-3 rounded-[24px] text-xl sm:text-2xl font-black tracking-wider uppercase shadow-[0_25px_60px_-15px_rgba(255,85,0,0.6)] transform -rotate-1">Quedé ${jokeName}</span>
      `;
      document.body.appendChild(jokeBadge);

      if (bgCanvas) bgCanvas.style.filter = "blur(15px) brightness(0.2) saturate(0.5)";

      jokeBadge.animate([
        { transform: 'translate(-50%, -30%) scale(0.6)', opacity: 0 },
        { transform: 'translate(-50%, -50%) scale(1.04) rotate(1deg)', opacity: 1, offset: 0.15 },
        { transform: 'translate(-50%, -50%) scale(1) rotate(0deg)', opacity: 1, offset: 0.20 },
        { transform: 'translate(-50%, -50%) scale(1) rotate(0deg)', opacity: 1, offset: 0.70 },
        { transform: 'translate(-50%, -55%) scale(0.95)', opacity: 0 }
      ], { duration: 1800, easing: 'cubic-bezier(0.25, 1, 0.5, 1)' }).onfinish = () => {
        jokeBadge.remove();
        if (bgCanvas) bgCanvas.style.filter = "blur(50px) brightness(0.3) saturate(1.5)";
      };
    }

    window.firebaseIncrement = (val) => val; 
    import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(mod => { window.firebaseIncrement = mod.increment; });

    window.toggleCommentsPopup = function() {
      if (document.startViewTransition) {
        document.startViewTransition(() => executeChatToggle());
      } else {
        executeChatToggle();
      }
    };

    function executeChatToggle() {
      window.triggerHaptic([10]);
      window.resetHudActivity();
      const popup = document.getElementById('commentsPopup');
      const toggleBtn = document.getElementById('toggleChatBtn');
      if (!popup || !toggleBtn) return;

      window.isChatOpen = !window.isChatOpen;

      if (window.isChatOpen) {
        popup.classList.remove('pointer-events-none', 'scale-95', 'opacity-0', 'h-0', 'mb-0');
        popup.classList.add('scale-100', 'opacity-100', 'h-[60px]', 'mb-2');
        toggleBtn.classList.add('bg-orange-500/50', 'border-orange-400');
        setTimeout(() => { document.getElementById('commentText')?.focus(); }, 300);
      } else {
        popup.classList.add('scale-95', 'opacity-0', 'h-0', 'pointer-events-none', 'mb-0');
        popup.classList.remove('scale-100', 'opacity-100', 'h-[60px]', 'mb-2');
        toggleBtn.classList.remove('bg-orange-500/50', 'border-orange-400');
        window.resetHudActivity();
      }
    }

    function filterProfanity(text) {
      const badWords = ['mierda', 'puta', 'puto', 'pendejo', 'imbecil', 'idiota', 'estupido', 'carajo', 'verga', 'cojudo'];
      let filtered = text;
      badWords.forEach(word => {
        const regex = new RegExp(`\\b${word}\\b`, 'gi');
        filtered = filtered.replace(regex, '🤬');
      });
      return filtered;
    }

    window.handleCommentSubmit = async function(e) {
      e.preventDefault();
      const textInput = document.getElementById('commentText');
      let text = textInput?.value.trim();
      if (!text || !state.currentImagePath) return;

      text = filterProfanity(text);
      textInput.value = '';

      if (db && auth && auth.currentUser) {
        try {
          const imgDocId = getImageDocId(state.currentImagePath);
          const commentsColRef = collection(db, 'Feria2026_Images', imgDocId, 'Comentarios');
          await addDoc(commentsColRef, { text: text, timestamp: serverTimestamp(), uid: auth.currentUser.uid });
          window.toggleCommentsPopup();
        } catch (err) {}
      }
    };

    async function fetchAllGitHubImages(owner, repo, branch) {
      let collectedFiles = [];
      try {
        const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`);
        if (response.ok) {
          const data = await response.json();
          if (data.tree) collectedFiles = data.tree.filter(i => i.type === 'blob' && VALID_EXTENSIONS.includes('.' + i.path.split('.').pop().toLowerCase()));
        }
      } catch (e) {}
      return collectedFiles;
    }

    async function initGallery() {
      state.fileList = await fetchAllGitHubImages(state.owner, state.repo, state.branch);
      if (state.fileList.length > 0) { await assignAndLoadUniqueImage(); } 
      else { dismissInitialLoader(); }
    }

    async function assignAndLoadUniqueImage() {
      let index = Math.floor(Math.random() * state.fileList.length);
      if (db && auth && auth.currentUser) {
        try {
          const counterRef = doc(db, 'Feria2026', 'Visitantes');
          const docSnap = await getDoc(counterRef);
          let currentCount = docSnap.exists() ? docSnap.data().count || 0 : 0;
          index = currentCount % state.fileList.length;
          await setDoc(counterRef, { count: currentCount + 1 }, { merge: true });
        } catch (e) { }
      }
      displayImageByIndex(index);
    }

    function displayImageByIndex(index) {
      if (index < 0 || index >= state.fileList.length) return;
      const file = state.fileList[index];
      state.currentImagePath = file.path;

      setupRealtimeListeners(file.path);

      const fetchImageAsBlob = async () => {
        try {
          const res = await fetch(`https://raw.githubusercontent.com/${state.owner}/${state.repo}/${state.branch}/${file.path.split('/').map(encodeURIComponent).join('/')}`);
          const blob = await res.blob();
          const objectUrl = URL.createObjectURL(blob);
          
          const img = new Image();
          img.onload = () => { 
            state.errorCount = 0; 
            renderImage(img); 
            dismissInitialLoader(); 
            URL.revokeObjectURL(objectUrl);
          };
          img.onerror = () => {
            URL.revokeObjectURL(objectUrl);
            retryImage(index);
          };
          img.src = objectUrl;
        } catch (e) { retryImage(index); }
      };

      fetchImageAsBlob();
    }

    function retryImage(index) {
      state.errorCount++;
      if (state.errorCount < 3) displayImageByIndex((index + 1) % state.fileList.length);
      else dismissInitialLoader();
    }

    let redrawTimeout;
    function resizeCanvas() {
      clearTimeout(redrawTimeout);
      const w = window.innerWidth; const h = window.innerHeight; const dpr = window.devicePixelRatio || 1;
      mainCanvas.width = w * dpr; mainCanvas.height = h * dpr;
      bgCanvas.width = w * dpr; bgCanvas.height = h * dpr;
      mainCtx.scale(dpr, dpr); bgCtx.scale(dpr, dpr);
      
      redrawTimeout = setTimeout(() => {
        if (state.currentImagePath) {
          const file = state.fileList.find(f => f.path === state.currentImagePath);
          if(file) {
             const imgIndex = state.fileList.indexOf(file);
             state.errorCount = 0;
             displayImageByIndex(imgIndex);
          }
        }
      }, 200);
    }

    function renderImage(img) {
      const w = window.innerWidth; const h = window.innerHeight;
      mainCtx.clearRect(0, 0, w, h); bgCtx.clearRect(0, 0, w, h);
      const imgRatio = (img.naturalWidth || img.width) / (img.naturalHeight || img.height); 
      const screenRatio = w / h;

      let bgW = screenRatio > imgRatio ? w : h * imgRatio;
      let bgH = screenRatio > imgRatio ? w / imgRatio : h;
      bgCtx.drawImage(img, (w - bgW) / 2, (h - bgH) / 2, bgW, bgH);

      let drawW = imgRatio > screenRatio ? w : h * imgRatio;
      let drawH = imgRatio > screenRatio ? w / imgRatio : h;
      mainCtx.save();
      mainCtx.translate(w / 2, h / 2); mainCtx.imageSmoothingEnabled = true; mainCtx.imageSmoothingQuality = 'high';
      mainCtx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
      mainCtx.restore();
    }

    const loaderStartTime = Date.now();
    let isLoaderDismissing = false;
    
    function dismissInitialLoader() {
      const initialLoader = document.getElementById('initialLoader');
      if (!initialLoader || isLoaderDismissing) return;
      isLoaderDismissing = true;
      const remainingTime = Math.max(0, 2000 - (Date.now() - loaderStartTime));

      setTimeout(() => {
        initialLoader.classList.add('pointer-events-none');
        let start = null;
        function step(timestamp) {
          if (!start) start = timestamp;
          const t = Math.min((timestamp - start) / 1000, 1);
          const easeT = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
          const radius = easeT * 150; 
          initialLoader.style.mask = `radial-gradient(circle, transparent ${radius}%, black ${radius + 1}%)`;
          initialLoader.style.WebkitMask = `radial-gradient(circle, transparent ${radius}%, black ${radius + 1}%)`;
          
          if (t < 1) requestAnimationFrame(step);
          else {
            initialLoader.style.display = 'none';
            window.isGalleryReady = true;
            if (hudContainer) {
              hudContainer.classList.remove('opacity-0', 'translate-y-16', 'pointer-events-none');
              window.resetHudActivity();
            }
          }
        }
        requestAnimationFrame(step);
      }, remainingTime);
    }
  </script>
