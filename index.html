    .glass-panel {

      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8);
      position: relative;
      overflow: hidden;
    }
    
    .glass-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle 80px at var(--spotlight-x) var(--spotlight-y), rgba(255, 85, 0, 0.2), transparent 100%);

      z-index: 0;

    // Global Toast Notification System (Minimalist Pop-up)
    window.showGlobalToast = function(message, icon) {
      const container = document.getElementById('toastContainer');
      if (!container) return;

      const toast = document.createElement('div');
      toast.className = 'flex items-center gap-2.5 px-3.5 py-2 bg-[#0B1B2F]/80 backdrop-blur-md border border-orange-500/30 rounded-[16px] shadow-[0_4px_20px_rgba(0,0,0,0.5)] text-xs text-white transform translate-x-full opacity-0 transition-all duration-500 ease-out will-change-transform';
      toast.innerHTML = `
        <span class="text-base drop-shadow-md animate-pulse">${icon}</span>
        <span class="font-light tracking-wide text-orange-50">${message}</span>
      `;

      container.appendChild(toast);

      // Animate In
      requestAnimationFrame(() => {
        toast.classList.remove('translate-x-full', 'opacity-0');
        toast.classList.add('translate-x-0', 'opacity-100');
      });

      // Animate Out and Remove
      setTimeout(() => {
        toast.classList.remove('translate-x-0', 'opacity-100');
        toast.classList.add('translate-x-12', 'opacity-0');
        setTimeout(() => toast.remove(), 500);
      }, 4000);
    };

    // Haptic Feedback Engine
    window.triggerHaptic = function(pattern) {
      if (navigator.vibrate) {
        try { navigator.vibrate(pattern); } catch (e) {}
      }
    };

    // Throttled Spotlight Spotlight Tracker
    let spotlightTicking = false;
    function processSpotlight(e) {
      const docks = document.querySelectorAll('.glass-panel');
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      
      docks.forEach(dock => {
        const rect = dock.getBoundingClientRect();
        dock.style.setProperty('--spotlight-x', `${x - rect.left}px`);
        dock.style.setProperty('--spotlight-y', `${y - rect.top}px`);
      });
      window.resetHudActivity();
      spotlightTicking = false;
    }

    window.addEventListener('mousemove', (e) => {
      if (!spotlightTicking) { requestAnimationFrame(() => processSpotlight(e)); spotlightTicking = true; }
    }, { passive: true });
    
    window.addEventListener('touchmove', (e) => {
      if (!spotlightTicking) { requestAnimationFrame(() => processSpotlight(e)); spotlightTicking = true; }
    }, { passive: true });

    let hudActivityTimer = null;

    window.keepHudActive = function() {
      window.hudHovered = true;
      window.resetHudActivity();
    };

    window.startHudIdleTimer = function() {
      window.hudHovered = false;
      window.resetHudActivity();
    };

    window.resetHudActivity = function() {
      if (!window.isGalleryReady) return;
      hudContainer.classList.remove('opacity-30', 'opacity-0');
      hudContainer.classList.add('opacity-100');
      
      clearTimeout(hudActivityTimer);
      hudActivityTimer = setTimeout(() => {
        if (!window.hudHovered) {
          hudContainer.classList.add('opacity-30');
        }
      }, 4000);
    };

    window.onload = async function() {
      resizeCanvas(); window.addEventListener('resize', resizeCanvas, { passive: true });
      
      try {
        const logoRes = await fetch("https://raw.githubusercontent.com/caortiz-stack/hosting/fdee49b549ea1c399079948645fb51c8645a8a80/Recurso%201.svg");
        const logoBlob = await logoRes.blob();
        document.getElementById('loaderLogo').src = URL.createObjectURL(logoBlob);
      } catch(e){}

      if (document.fonts) document.fonts.ready.then(() => {
          const sticker = document.getElementById('stickerAssembly');
          if (sticker) sticker.classList.remove('opacity-0');
      });
      await initFirebaseAndApp();
    };

    async function initFirebaseAndApp() {
      try {
        const app = initializeApp(MY_FIREBASE_CONFIG);
        auth = getAuth(app); db = getFirestore(app);
        await signInAnonymously(auth); 
        await initGallery();
      } catch (e) {
        await initGallery();
      }
    }

    function getImageDocId(path) { return btoa(path).replace(/[/+=]/g, '_'); }

    let activeReactionsUnsubscribe = null;
    let previousReactionsState = {};
    let isFirstReactionsLoad = true;
    let localReactionPendingEmoji = null;

    // Efecto visual para reacciones hechas por otras personas en tiempo real
    window.triggerRemoteReaction = function(emoji) {
      const btn = document.getElementById(`btn-${emoji}`);
      if (!btn) return;
      const rect = btn.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top;
      
      const particleCount = 3 + Math.floor(Math.random() * 3);

      for (let i = 0; i < particleCount; i++) {
        const p = document.createElement('div');
        p.textContent = emoji;
        p.className = 'fixed z-[60] pointer-events-none select-none drop-shadow-md will-change-transform';
        p.style.fontSize = `${14 + Math.random() * 10}px`;
        p.style.left = `${centerX - 10}px`; 
        p.style.top = `${centerY - 10}px`;
        document.body.appendChild(p);

        const angle = -Math.PI / 2 + (Math.random() * 1.6 - 0.8);
        const velocity = 40 + Math.random() * 80;
        const endX = centerX + Math.cos(angle) * velocity;
        const endY = centerY - (100 + Math.random() * 100); 

        p.animate([
          { transform: 'translate(0, 0) scale(0.4) rotate(0deg)', opacity: 0.8 },
          { transform: `translate(${endX - centerX}px, ${endY - centerY}px) scale(1.2) rotate(${Math.random() * 90 - 45}deg)`, opacity: 0.6, offset: 0.6 },
          { transform: `translate(${(endX - centerX) * 1.3}px, ${(endY - centerY) - 60}px) scale(0.5) rotate(${Math.random() * 180}deg)`, opacity: 0 }
        ], { duration: 1200 + Math.random() * 500, easing: 'cubic-bezier(0.25, 1, 0.5, 1)' }).onfinish = () => p.remove();
      }
    };

    async function setupRealtimeListeners(imagePath) {
      if (!db || !auth.currentUser) return;
      const imgDocId = getImageDocId(imagePath);

      if (activeReactionsUnsubscribe) activeReactionsUnsubscribe();
      
      userCurrentReaction = null;
      previousReactionsState = {};
      isFirstReactionsLoad = true;
      updateReactionButtonsUI();

      try {
        const userVoteDoc = doc(db, 'Feria2026_Images', imgDocId, 'Voters', auth.currentUser.uid);
        const voteSnap = await getDoc(userVoteDoc);
        if (voteSnap.exists()) {
          userCurrentReaction = voteSnap.data().emoji;
          updateReactionButtonsUI();
        }
      } catch (e) {}

      const reactionsRef = doc(db, 'Feria2026_Images', imgDocId);
      activeReactionsUnsubscribe = onSnapshot(reactionsRef, (snapshot) => {
        const data = snapshot.exists() ? snapshot.data() : {};
        
        ['😍', '😂', '🤡', '😱', '🤌'].forEach(emoji => {
          const countEl = document.getElementById(`count-${emoji}`);
          const badgeEl = document.getElementById(`badge-${emoji}`);
          
          const newValNum = data[emoji] || 0;
          const oldValNum = previousReactionsState[emoji] || 0;

          // Real-time notification logic
          if (!isFirstReactionsLoad && newValNum > oldValNum) {
            // Only show toast if it's not the user's immediate local click, 
            // to make it feel like "someone else" is interacting network-wide.
            if (localReactionPendingEmoji !== emoji) {
              window.showGlobalToast("Nueva reacción", emoji);
              window.triggerRemoteReaction(emoji); // Disparar efecto en pantalla
            }
          }

          if (countEl && badgeEl) {
            const oldValText = countEl.textContent;
            const newValText = newValNum.toString();
            if (oldValText !== newValText) {
              countEl.textContent = newValText;
              badgeEl.classList.remove('animate-pop');
              void badgeEl.offsetWidth; 
              badgeEl.classList.add('animate-pop');
            }
          }
          previousReactionsState[emoji] = newValNum;
        });
        
        // Reset the local pending flag after processing a snapshot
        localReactionPendingEmoji = null;
        isFirstReactionsLoad = false;
      }, (err) => {});
    }

    function updateReactionButtonsUI() {
      ['😍', '😂', '🤡', '😱', '🤌'].forEach(emoji => {
        const btn = document.getElementById(`btn-${emoji}`);
        const badgeEl = document.getElementById(`badge-${emoji}`);
        if (!btn || !badgeEl) return;
        
        if (userCurrentReaction === emoji) {

    window.handleReactionClick = async function(emoji, designJokeName) {
      window.triggerHaptic([20, 30, 20]);
      window.resetHudActivity();
      
      const btn = document.getElementById(`btn-${emoji}`);
      if (!btn) return;

      const centerY = rect.top;
      
      const particleCount = 8 + Math.floor(Math.random() * 6);

      for (let i = 0; i < particleCount; i++) {
        const p = document.createElement('div');
        p.textContent = emoji;
        p.className = 'fixed z-[70] pointer-events-none select-none drop-shadow-md will-change-transform';
        p.style.fontSize = `${16 + Math.random() * 14}px`;
        p.style.left = `${centerX - 10}px`; 
        p.style.top = `${centerY - 10}px`;
        document.body.appendChild(p);

        const angle = -Math.PI / 2 + (Math.random() * 1.4 - 0.7);
        const velocity = 50 + Math.random() * 100;
        const endX = centerX + Math.cos(angle) * velocity;
        const endY = centerY - (140 + Math.random() * 120); 

        p.animate([
          { transform: 'translate(0, 0) scale(0.4) rotate(0deg)', opacity: 1 },
          { transform: `translate(${endX - centerX}px, ${endY - centerY}px) scale(1.4) rotate(${Math.random() * 90 - 45}deg)`, opacity: 0.85, offset: 0.6 },
          { transform: `translate(${(endX - centerX) * 1.3}px, ${(endY - centerY) - 80}px) scale(0.5) rotate(${Math.random() * 180}deg)`, opacity: 0 }
        ], { duration: 1000 + Math.random() * 500, easing: 'cubic-bezier(0.25, 1, 0.5, 1)' }).onfinish = () => p.remove();
      }

      if (!db || !auth || !auth.currentUser || !state.currentImagePath) return;
      const imgDocId = getImageDocId(state.currentImagePath);
      const reactionsRef = doc(db, 'Feria2026_Images', imgDocId);
      const userVoteDoc = doc(db, 'Feria2026_Images', imgDocId, 'Voters', auth.currentUser.uid);

      let payload = {};
      const previousReaction = userCurrentReaction;

      if (previousReaction === emoji) {
        showJokeBadgeAnimation(emoji, designJokeName);
        return;
      }

      if (previousReaction) {
        payload[previousReaction] = window.firebaseIncrement ? window.firebaseIncrement(-1) : -1;
      }
      payload[emoji] = window.firebaseIncrement ? window.firebaseIncrement(1) : 1;

      userCurrentReaction = emoji;
      localReactionPendingEmoji = emoji; // Mark this so we don't pop a toast for our own action
      updateReactionButtonsUI();
      showJokeBadgeAnimation(emoji, designJokeName);

      try {
        await setDoc(reactionsRef, payload, { merge: true });
        await setDoc(userVoteDoc, { emoji: emoji, timestamp: serverTimestamp() });
      } catch (err) {}
    };

    function showJokeBadgeAnimation(emoji, jokeName) {
      const reactionColors = {
        '😍': 'rgba(236, 72, 153, 0.35)',
        '😂': 'rgba(234, 179, 8, 0.35)',
        '🤡': 'rgba(168, 85, 247, 0.35)',
        '😱': 'rgba(6, 182, 212, 0.35)',
        '🤌': 'rgba(249, 115, 22, 0.35)'
      };
      
      const impactOverlay = document.createElement('div');
      impactOverlay.className = 'fixed inset-0 z-[25] pointer-events-none mix-blend-screen transition-opacity duration-300 ease-out opacity-0';
      impactOverlay.style.background = `radial-gradient(circle at center, ${reactionColors[emoji] || 'rgba(255,255,255,0.2)'} 0%, transparent 80%)`;
      document.body.appendChild(impactOverlay);

      if (mainCanvas) mainCanvas.style.transform = 'scale(0.96)';

      requestAnimationFrame(() => {
        impactOverlay.style.opacity = '1';
        setTimeout(() => { impactOverlay.style.opacity = '0'; }, 150);
      });

      const jokeBadge = document.createElement('div');
      jokeBadge.className = 'fixed z-[80] pointer-events-none flex flex-col items-center justify-center w-full top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 will-change-transform';
      jokeBadge.innerHTML = `
        <span class="text-[80px] sm:text-[110px] filter drop-shadow-[0_0_40px_rgba(255,85,0,0.8)] mb-[-20px] z-10 animate-bounce">${emoji}</span>
        <span class="font-display bg-black/85 backdrop-blur-2xl border-2 border-orange-500/40 text-orange-100 px-6 py-3 rounded-[24px] text-xl sm:text-2xl font-black tracking-wider uppercase shadow-[0_25px_60px_-15px_rgba(255,85,0,0.6)] transform -rotate-1 text-center leading-none">Quedé<br><span class="text-lg text-white/80">${jokeName}</span></span>
      `;
      document.body.appendChild(jokeBadge);

      jokeBadge.animate([
        { transform: 'translate(-50%, -30%) scale(0.6)', opacity: 0 },
        { transform: 'translate(-50%, -50%) scale(1.04) rotate(1deg)', opacity: 1, offset: 0.15 },
        { transform: 'translate(-50%, -50%) scale(1) rotate(0deg)', opacity: 1, offset: 0.20 },
        { transform: 'translate(-50%, -50%) scale(1) rotate(0deg)', opacity: 1, offset: 0.70 },
        { transform: 'translate(-50%, -55%) scale(0.9)', opacity: 0 }
      ], { duration: 1600, easing: 'cubic-bezier(0.25, 1, 0.5, 1)' }).onfinish = () => {
        jokeBadge.remove();
        setTimeout(() => impactOverlay.remove(), 250);
        if (mainCanvas) mainCanvas.style.transform = 'scale(1)';
      };
    }

    window.firebaseIncrement = (val) => val; 
    import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(mod => { window.firebaseIncrement = mod.increment; });

    async function fetchAllGitHubImages(owner, repo, branch) {
      let collectedFiles = [];
      try {
        // Evitamos enviar headers personalizados para no romper las políticas de CORS de GitHub
        const bust = new Date().getTime();
        const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1&t=${bust}`);
        if (response.ok) {
          const data = await response.json();
          if (data.tree) collectedFiles = data.tree.filter(i => i.type === 'blob' && VALID_EXTENSIONS.includes('.' + i.path.split('.').pop().toLowerCase()));
        }
      } catch (e) {}
      return collectedFiles;
    }

    async function initGallery() {
      state.fileList = await fetchAllGitHubImages(state.owner, state.repo, state.branch);
      if (state.fileList.length > 0) { await assignAndLoadUniqueImage(); } 
      else { dismissInitialLoader(); }
    }

    async function assignAndLoadUniqueImage() {
      let index = Math.floor(Math.random() * state.fileList.length);
      if (db && auth && auth.currentUser) {
        try {
          const counterRef = doc(db, 'Feria2026', 'Visitantes');
          // Uso de Transacción para garantizar que el método de tickets sea 100% exacto en tiempo real
          const currentCount = await runTransaction(db, async (transaction) => {
            const docSnap = await transaction.get(counterRef);
            const count = docSnap.exists() ? docSnap.data().count || 0 : 0;
            transaction.set(counterRef, { count: count + 1 }, { merge: true });
            return count;
          });
          index = currentCount % state.fileList.length;
        } catch (e) { }
      }
      displayImageByIndex(index);
    }

    function displayImageByIndex(index) {
      if (index < 0 || index >= state.fileList.length) return;
      const file = state.fileList[index];
      state.currentImagePath = file.path;

      setupRealtimeListeners(file.path);

      const fetchImageAsBlob = async () => {
        try {
          const bust = new Date().getTime();
          const encodedPath = file.path.split('/').map(encodeURIComponent).join('/');
          
          // Se utiliza el parámetro URL para evadir caché, sin bloquear CORS
          const res = await fetch(`https://raw.githubusercontent.com/${state.owner}/${state.repo}/${state.branch}/${encodedPath}?t=${bust}`);
          
          if (!res.ok) throw new Error("Image no encontrada o eliminada");
          
          const blob = await res.blob();
          const objectUrl = URL.createObjectURL(blob);
          
          const img = new Image();
          img.onload = () => { 
            state.errorCount = 0; 
            renderImage(img); 
            dismissInitialLoader(); 
            setTimeout(() => URL.revokeObjectURL(objectUrl), 10);
          };
          img.onerror = () => {
            URL.revokeObjectURL(objectUrl);
            retryImage(index);
          };
          img.src = objectUrl;
        } catch (e) { retryImage(index); }
      };
      fetchImageAsBlob();
    }

    function retryImage(index) {
      state.errorCount++;
      if (state.errorCount < 3) displayImageByIndex((index + 1) % state.fileList.length);
      else dismissInitialLoader();
    }

    let redrawTimeout;
    function resizeCanvas() {
      clearTimeout(redrawTimeout);
      const w = window.innerWidth; const h = window.innerHeight; const dpr = window.devicePixelRatio || 1;
      
      mainCanvas.width = w * dpr; mainCanvas.height = h * dpr;
      mainCtx.scale(dpr, dpr);
      
      // Low Resolution Math Scale for Background Blur Optimization on Android
      bgCanvas.width = (w * dpr) / 10; bgCanvas.height = (h * dpr) / 10;
      bgCtx.scale(dpr / 10, dpr / 10);
      
      redrawTimeout = setTimeout(() => {
        if (state.currentImagePath) {
          const file = state.fileList.find(f => f.path === state.currentImagePath);
          if(file) {
             const imgIndex = state.fileList.indexOf(file);
             state.errorCount = 0;
             displayImageByIndex(imgIndex);
          }
        }
      }, 200);
    }

    function renderImage(img) {
      const w = window.innerWidth; const h = window.innerHeight;
      mainCtx.clearRect(0, 0, w, h); bgCtx.clearRect(0, 0, w, h);
      const imgRatio = (img.naturalWidth || img.width) / (img.naturalHeight || img.height); 
      const screenRatio = w / h;

      let bgW = screenRatio > imgRatio ? w : h * imgRatio;
      let bgH = screenRatio > imgRatio ? w / imgRatio : h;
      bgCtx.drawImage(img, (w - bgW) / 2, (h - bgH) / 2, bgW, bgH);

      let drawW = imgRatio > screenRatio ? w : h * imgRatio;
      let drawH = imgRatio > screenRatio ? w / imgRatio : h;
      mainCtx.save();
      mainCtx.translate(w / 2, h / 2); mainCtx.imageSmoothingEnabled = true; mainCtx.imageSmoothingQuality = 'medium';
      mainCtx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
      mainCtx.restore();
    }

    const loaderStartTime = Date.now();
    let isLoaderDismissing = false;
    
    function dismissInitialLoader() {
      const initialLoader = document.getElementById('initialLoader');
      if (!initialLoader || isLoaderDismissing) return;
      isLoaderDismissing = true;
      const remainingTime = Math.max(0, 2000 - (Date.now() - loaderStartTime));

      setTimeout(() => {
        initialLoader.classList.add('pointer-events-none');
        let start = null;
        function step(timestamp) {
          if (!start) start = timestamp;
          const t = Math.min((timestamp - start) / 1000, 1);
          const easeT = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
          const radius = easeT * 150; 
          initialLoader.style.mask = `radial-gradient(circle, transparent ${radius}%, black ${radius + 1}%)`;
          initialLoader.style.WebkitMask = `radial-gradient(circle, transparent ${radius}%, black ${radius + 1}%)`;
          
          if (t < 1) requestAnimationFrame(step);
          else {
            initialLoader.style.display = 'none';
            window.isGalleryReady = true;
            if (hudContainer) {
              hudContainer.classList.remove('opacity-0', 'translate-y-16', 'pointer-events-none');
              window.resetHudActivity();
            }
          }
        }
        requestAnimationFrame(step);
      }, remainingTime);
    }
  </script>
