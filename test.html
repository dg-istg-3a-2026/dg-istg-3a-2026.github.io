      // Trazo semitransparente premium (efecto vidrio/iluminación interior)
      _mnCx.lineWidth = 2; // Usamos 2px para que con el clip quede visualmente de 1px puro
      _mnCx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      _mnCx.stroke();
      
      _mnCx.restore();
    }
