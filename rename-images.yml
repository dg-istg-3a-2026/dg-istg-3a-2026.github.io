name: Renombrar Imágenes Automáticamente

on:
  push:
    branches:
      - MochilaDeCaleb
    paths:
      - '**/images/**'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña 'Actions'

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          ref: MochilaDeCaleb

      - name: Renombrar y organizar imágenes
        run: |
          # ⚠️ Cambia a "." si tus imágenes están sueltas en la raíz, 
          # o pon el nombre de tu carpeta si están guardadas en una (ej. "images")
          TARGET_DIR="."
          
          if [ -d "$TARGET_DIR" ]; then
            cd "$TARGET_DIR"
            
            # Contador inicial
            i=1
            
            # Primera pasada: mover a nombres temporales para evitar conflictos
            find . -maxdepth 1 -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" -o -iname "*.gif" \) | sort | while read -r file; do
              # Evitar procesar archivos que ya empiecen con 'Image' o 'temp_img_'
              filename=$(basename "$file")
              if [[ "$filename" =~ ^(Image|temp_img_) ]]; then
                continue
              fi
              
              ext="${file##*.}"
              ext=$(echo "$ext" | tr '[:upper:]' '[:lower:]')
              new_name="temp_img_$i.$ext"
              mv "$file" "$new_name"
              i=$((i + 1))
            done
            
            # Segunda pasada: renombrar ordenadamente como Image1, Image2, Image3...
            j=1
            find . -maxdepth 1 -type f -name "temp_img_*" | sort -V | while read -r temp_file; do
              ext="${temp_file##*.}"
              mv "$temp_file" "./Image$j.$ext"
              j=$((j + 1))
            done
            
            cd ..
          else
            echo "La carpeta '$TARGET_DIR' no existe."
          fi

      - name: Commit y Push de los cambios
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automático: Renombrar imágenes existentes a Image1, Image2..."
          branch: MochilaDeCaleb
          create_branch: false
